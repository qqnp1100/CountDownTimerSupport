plugins {
    id 'com.android.application'
}

android {
    namespace = 'in.xiandan.countdowntimer.example'
    compileSdk = rootProject.ext.android.compileSdkVersion
    enableKotlin = false
    defaultConfig {
        applicationId "in.xiandan.countdowntimer.example"
        minSdk = rootProject.ext.android.minSdkVersion
        targetSdk = rootProject.ext.android.targetSdkVersion
        versionCode = rootProject.ext.android.targetSdkVersion
        versionName = rootProject.ext.android.versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:' + rootProject.ext.android.supportVersion
    implementation 'com.android.support:recyclerview-v7:' + rootProject.ext.android.supportVersion
    implementation project(path: ':count-down-timer')
}
