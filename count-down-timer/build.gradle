plugins {
    id 'com.android.library'
    id 'maven-publish'
}

version = rootProject.ext.android.versionName
group = rootProject.ext.library.groupId

android {
    namespace = 'in.xiandan.countdowntimer'
    compileSdk = rootProject.ext.android.compileSdkVersion
    enableKotlin = false

    defaultConfig {
        minSdk = rootProject.ext.android.minSdkVersion
        aarMetadata {
            // Keep the Java-only library consumable with Android API 14 and above.
            minCompileSdk = rootProject.ext.android.minSdkVersion
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
}

tasks.withType(Javadoc).configureEach {
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        author = true
        version = true
    }
}

publishing {
    publications {
        register('release', MavenPublication) {
            artifactId = rootProject.ext.library.artifactId
            pom {
                name = rootProject.ext.library.name
                description = rootProject.ext.library.description
                url = rootProject.ext.library.siteUrl
                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = rootProject.ext.library.authorId
                        name = rootProject.ext.library.authorName
                        email = rootProject.ext.library.authorEmail
                    }
                }
                scm {
                    connection = rootProject.ext.library.gitUrl
                    developerConnection = rootProject.ext.library.gitUrl
                    url = rootProject.ext.library.siteUrl
                }
            }
        }
    }
}

afterEvaluate {
    publishing.publications.named('release', MavenPublication) {
        from components.release
    }
}
